version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: softspeak_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-softspeak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softspeak_pass}
      POSTGRES_DB: ${POSTGRES_DB:-softspeak_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-softspeak_user} -d ${POSTGRES_DB:-softspeak_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - softspeak-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: softspeak_mailhog
    restart: always
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - softspeak-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: softspeak_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-softspeak_user}:${POSTGRES_PASSWORD:-softspeak_pass}@db:5432/${POSTGRES_DB:-softspeak_db}
      
      ML_SERVICE_URL: http://ml-service:8001
      
      # Режим разработки: true = MailHog, false = реальный SMTP
      DEV_MODE: ${DEV_MODE:-true}
      
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-secure-key}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-30}
      
      EMAIL_FROM: ${EMAIL_FROM:-noreply@softspeak.com}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      
      VERIFICATION_CODE_TTL_MIN: ${VERIFICATION_CODE_TTL_MIN:-10}
      VERIFICATION_CODE_LENGTH: ${VERIFICATION_CODE_LENGTH:-6}
      
      RATE_LIMIT_EMAIL_PER_HOUR: ${RATE_LIMIT_EMAIL_PER_HOUR:-5}
      
      MATCH_SIMILARITY_THRESHOLD: ${MATCH_SIMILARITY_THRESHOLD:-0.65}
      
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin_token_secret_change_in_production}
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/static:/app/static
    networks:
      - softspeak-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "cd src && 
             uv run alembic upgrade head && 
             cd .. && 
             uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: softspeak_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - softspeak-network
  
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: softspeak_ml
    restart: always
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    environment:
      MODEL_NAME: ${ML_MODEL_NAME:-intfloat/multilingual-e5-base}
      PYTHONUNBUFFERED: 1
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ml_cache:/app/.cache/huggingface
      - ./ml:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json; r = urllib.request.urlopen('http://localhost:8001/health'); data = json.loads(r.read()); exit(0 if data.get('model_status') == 'loaded' else 1)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 600s  
    networks:
      - softspeak-network

networks:
  softspeak-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ml_cache:
    driver: local

