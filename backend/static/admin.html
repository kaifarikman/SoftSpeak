<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель SoftSpeak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        /* Login Form */
        .login-form {
            max-width: 400px;
            margin: 50px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #f9fafb;
            transition: all 0.3s;
        }

        .category-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .category-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .category-card p {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .questions-list {
            margin-top: 15px;
        }

        .question-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .question-item.inactive {
            opacity: 0.6;
            border-left-color: #9ca3af;
        }

        .question-text {
            flex: 1;
            margin-right: 10px;
        }

        .question-actions {
            display: flex;
            gap: 5px;
        }

        .add-question-form {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Админ-панель SoftSpeak</h1>
            <p>Управление вопросами психологического опроса</p>
            <button class="btn logout-btn" onclick="logout()" style="display: none;" id="logoutBtn">Выйти</button>
        </div>

        <div class="content">
            <!-- Login Form -->
            <div id="loginForm" class="login-form">
                <h2 style="text-align: center; margin-bottom: 30px;">Вход в систему</h2>
                <div class="form-group">
                    <label>Имя пользователя:</label>
                    <input type="text" id="username" value="admin" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="password" value="admin" placeholder="admin">
                </div>
                <button class="btn btn-primary" onclick="login()">Войти</button>
                <div id="loginResult"></div>
            </div>

            <!-- Admin Panel -->
            <div id="adminPanel" class="admin-panel">
                <div id="stats" class="stats"></div>
                
                <h2 style="margin-bottom: 20px;">Категории и вопросы</h2>
                <div id="categories" class="categories-grid"></div>

                <div class="add-question-form">
                    <h3 style="margin-bottom: 15px;">➕ Добавить новый вопрос</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Категория:</label>
                            <select id="categorySelect"></select>
                        </div>
                        <div class="form-group">
                            <label>Порядок:</label>
                            <input type="number" id="questionOrder" value="0" min="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Текст вопроса:</label>
                        <textarea id="questionText" placeholder="Введите текст вопроса..."></textarea>
                    </div>
                    <button class="btn btn-success" onclick="addQuestion()">Добавить вопрос</button>
                    <div id="questionResult"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let token = '';
        let categories = [];
        let questions = {};

        // Проверяем, есть ли сохраненный токен
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('admin_token');
            if (savedToken) {
                token = savedToken;
                checkAuth();
            }
        });

        async function checkAuth() {
            try {
                const response = await fetch(`${API_URL}/admin/categories`, {
                    headers: { 'Authorization': token }
                });
                
                if (response.ok) {
                    showAdminPanel();
                    loadData();
                } else {
                    localStorage.removeItem('admin_token');
                    token = '';
                }
            } catch (error) {
                localStorage.removeItem('admin_token');
                token = '';
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Вход...</div>';
            
            try {
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    token = data.token;
                    localStorage.setItem('admin_token', token);
                    resultDiv.innerHTML = '<div class="alert alert-success">✅ Вход выполнен успешно!</div>';
                    setTimeout(() => {
                        showAdminPanel();
                        loadData();
                    }, 500);
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-error">❌ Ошибка: ${data.detail || 'Неверный логин или пароль'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-error">❌ Ошибка подключения: ${error.message}</div>`;
            }
        }

        function logout() {
            token = '';
            localStorage.removeItem('admin_token');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin';
        }

        function showAdminPanel() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminPanel').classList.add('active');
            document.getElementById('logoutBtn').style.display = 'block';
        }

        async function loadData() {
            try {
                // Загружаем категории
                const categoriesResponse = await fetch(`${API_URL}/admin/categories`, {
                    headers: { 'Authorization': token }
                });
                categories = await categoriesResponse.json();

                // Загружаем вопросы для каждой категории
                for (const category of categories) {
                    const questionsResponse = await fetch(`${API_URL}/admin/categories/${category.id}/questions`, {
                        headers: { 'Authorization': token }
                    });
                    questions[category.id] = await questionsResponse.json();
                }

                renderStats();
                renderCategories();
                renderCategorySelect();
            } catch (error) {
                showAlert('adminPanel', `Ошибка загрузки данных: ${error.message}`, 'error');
            }
        }

        function renderStats() {
            const totalQuestions = Object.values(questions).flat().length;
            const activeQuestions = Object.values(questions).flat().filter(q => q.is_active).length;
            const totalCategories = categories.length;

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <h3>${totalCategories}</h3>
                    <p>Категорий</p>
                </div>
                <div class="stat-card">
                    <h3>${totalQuestions}</h3>
                    <p>Всего вопросов</p>
                </div>
                <div class="stat-card">
                    <h3>${activeQuestions}</h3>
                    <p>Активных вопросов</p>
                </div>
            `;
        }

        function renderCategories() {
            const categoriesDiv = document.getElementById('categories');
            categoriesDiv.innerHTML = categories.map(category => {
                const categoryQuestions = questions[category.id] || [];
                const activeCount = categoryQuestions.filter(q => q.is_active).length;
                
                return `
                    <div class="category-card">
                        <h3>${category.name}</h3>
                        <p>${category.description || 'Без описания'}</p>
                        <p style="font-size: 0.85em; color: #9ca3af;">
                            Вопросов: ${categoryQuestions.length} (активных: ${activeCount})
                        </p>
                        <div class="questions-list">
                            ${categoryQuestions.length > 0 
                                ? categoryQuestions.map(q => `
                                    <div class="question-item ${q.is_active ? '' : 'inactive'}">
                                        <div class="question-text">
                                            <strong>${q.text}</strong>
                                            <div style="font-size: 0.85em; color: #9ca3af; margin-top: 5px;">
                                                Порядок: ${q.order} | ${q.is_active ? '✅ Активен' : '❌ Неактивен'}
                                            </div>
                                        </div>
                                        <div class="question-actions">
                                            <button class="btn btn-secondary" onclick="toggleQuestion(${q.id}, ${!q.is_active})">
                                                ${q.is_active ? 'Деактивировать' : 'Активировать'}
                                            </button>
                                            <button class="btn btn-danger" onclick="deleteQuestion(${q.id})">Удалить</button>
                                        </div>
                                    </div>
                                `).join('')
                                : '<p style="color: #9ca3af; font-style: italic;">Нет вопросов</p>'
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderCategorySelect() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = categories.map(cat => 
                `<option value="${cat.id}">${cat.name}</option>`
            ).join('');
        }

        async function addQuestion() {
            const categoryId = parseInt(document.getElementById('categorySelect').value);
            const text = document.getElementById('questionText').value.trim();
            const order = parseInt(document.getElementById('questionOrder').value) || 0;
            const resultDiv = document.getElementById('questionResult');
            
            if (!text) {
                resultDiv.innerHTML = '<div class="alert alert-error">❌ Введите текст вопроса</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Добавление...</div>';
            
            try {
                const response = await fetch(`${API_URL}/admin/questions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        category_id: categoryId,
                        text: text,
                        order: order,
                        is_active: true
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="alert alert-success">✅ Вопрос добавлен успешно!</div>';
                    document.getElementById('questionText').value = '';
                    // Перезагружаем данные
                    await loadData();
                    setTimeout(() => {
                        resultDiv.innerHTML = '';
                    }, 3000);
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-error">❌ Ошибка: ${data.detail || 'Не удалось добавить вопрос'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-error">❌ Ошибка: ${error.message}</div>`;
            }
        }

        async function toggleQuestion(questionId, newStatus) {
            try {
                const response = await fetch(`${API_URL}/admin/questions/${questionId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        is_active: newStatus
                    })
                });
                
                if (response.ok) {
                    await loadData();
                    showAlert('adminPanel', `Вопрос ${newStatus ? 'активирован' : 'деактивирован'}`, 'success');
                } else {
                    const data = await response.json();
                    showAlert('adminPanel', `Ошибка: ${data.detail}`, 'error');
                }
            } catch (error) {
                showAlert('adminPanel', `Ошибка: ${error.message}`, 'error');
            }
        }

        async function deleteQuestion(questionId) {
            if (!confirm('Вы уверены, что хотите удалить этот вопрос?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/admin/questions/${questionId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': token
                    }
                });
                
                if (response.ok || response.status === 204) {
                    await loadData();
                    showAlert('adminPanel', 'Вопрос удален', 'success');
                } else {
                    const data = await response.json();
                    showAlert('adminPanel', `Ошибка: ${data.detail}`, 'error');
                }
            } catch (error) {
                showAlert('adminPanel', `Ошибка: ${error.message}`, 'error');
            }
        }

        function showAlert(containerId, message, type) {
            const container = document.getElementById(containerId);
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.insertBefore(alert, container.firstChild);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Обработка Enter в форме входа
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
